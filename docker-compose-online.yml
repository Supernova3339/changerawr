version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: changerawr_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: changerawr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d changerawr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/supernova3339/changerawr:latest
    container_name: changerawr_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/changerawr?schema=public"
      # ⚠️  SECURITY WARNING: CHANGE THIS SECRET IMMEDIATELY!
      # Generate a secure secret with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Using the default value allows attackers to forge authentication tokens!
      JWT_ACCESS_SECRET: "your_jwt_secret_key_here_change_me"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      GITHUB_ENCRYPTION_KEY: "abcdef1234567890abcdef1234567890"
      ANALYTICS_SALT: "your_secure_analytics_salt_here"
      NODE_ENV: "production"
      # Changelog tagger (AI tag suggestions) — auto-detected by the app when reachable, no manual config needed
      CHANGELOG_TAGGER_URL: "http://tagger:31672"
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/uploads
      - app_public:/app/public/generated
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Optional: AI changelog tagger. The app auto-detects it via CHANGELOG_TAGGER_URL
  # above — nothing else to configure. Remove this service if you don't want it.
  tagger:
    image: ghcr.io/changerawr/tag-ai:latest
    container_name: changerawr_tagger
    environment:
      PORT: "31672"
    volumes:
      - tagger_models:/app/models
      # Config (ctag.conf) + runtime data (tag feedback, auto-training state).
      # Mounted at /app/runtime, NOT /app/data — seed training data lives at
      # /app/data baked into the image itself, so it always stays current
      # across image upgrades instead of getting stuck with whatever this
      # volume happened to contain the first time it was created.
      - tagger_data:/app/runtime
    # Hard cap — the OOM killer takes the container down cleanly at this
    # limit rather than it (or the host) running unbounded.
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:31672/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  app_public:
    driver: local
  tagger_models:
    driver: local
  tagger_data:
    driver: local
